name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (epoll)
            os: ubuntu-latest
            backend: ""
            deps: ""
          - name: Linux (io_uring)
            os: ubuntu-latest
            backend: "BACKEND=iouring"
            deps: "liburing-dev"
          - name: Linux (poll fallback)
            os: ubuntu-latest
            backend: "BACKEND=poll"
            deps: ""
          - name: macOS (kqueue)
            os: macos-latest
            backend: ""
            deps: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk ${{ matrix.deps }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install wrk

      - name: Build
        run: make ${{ matrix.backend }}

      - name: Test
        timeout-minutes: 5
        run: make test ${{ matrix.backend }}

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke ${{ matrix.backend }}

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: make debug-test

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: make fuzz CC=clang

      - name: Fuzz HTTP parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_parser fuzz/corpus_parser/ -max_total_time=60

      - name: Fuzz multipart parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_multipart fuzz/corpus_multipart/ -max_total_time=60

      - name: Fuzz WebSocket parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_websocket fuzz/corpus_websocket/ -max_total_time=60

      - name: Fuzz response parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_response_parser fuzz/corpus_response_parser/ -max_total_time=60

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  musl:
    name: Linux (musl/Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.19

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install deps
        run: apk add --no-cache build-base curl

      - name: Build
        run: make

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install cosmocc
        run: |
          mkdir -p /opt/cosmo
          wget -qO /tmp/cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip -q -d /opt/cosmo /tmp/cosmocc.zip
          rm /tmp/cosmocc.zip
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build
        run: make CC=cosmocc

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke CC=cosmocc
