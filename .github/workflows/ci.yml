name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (epoll)
            os: ubuntu-latest
            backend: ""
            deps: ""
          # io_uring is completion-native (8f-5d) and can't run the full `make test`
          # (some readiness-shaped suites are excluded — see IOURING_TEST_SUITES); it is
          # covered end-to-end by the dedicated "Completion (io_uring)" + unit-suite jobs
          # below, so it is not a full-suite matrix entry.
          - name: Linux (poll fallback)
            os: ubuntu-latest
            backend: "BACKEND=poll"
            deps: ""
          - name: macOS (kqueue)
            os: macos-latest
            backend: ""
            deps: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk ${{ matrix.deps }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install wrk

      - name: Build
        run: make ${{ matrix.backend }}

      - name: Test
        timeout-minutes: 5
        run: make test ${{ matrix.backend }}

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke ${{ matrix.backend }}

  completion:
    # The portable poll() completion backend (BACKEND=pollcomp, PAL 8d-0.5): runs the
    # platform-independent completion driver (completion_driver.c) — the same one IOCP
    # uses — on real POSIX runners, so the completion axis is genuinely CI-tested off
    # Windows (not just compile-gated). Proves the axis is platform-independent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: Completion (poll)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build completion backend (pollcomp)
        run: make BACKEND=pollcomp

      - name: End-to-end HTTP-over-completion roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=pollcomp smoke-pollcomp

      # TLS-over-completion via the identity mock TLS (no mbedTLS): runs comp_tls_drive,
      # the memory-BIO feed/drain plumbing, and comp_tls_send_response/file/stream for real.
      - name: TLS-over-completion roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=pollcomp smoke-pollcomp-tls

      # WebSocket over the completion loop (comp_ws_drive) — reuses the WS frame core.
      - name: WebSocket-over-completion roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=pollcomp smoke-pollcomp-ws

      # Async/thread-pool handler over completion — the watcher relay + async resume (8e-2).
      - name: Async/thread-pool-over-completion roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=pollcomp smoke-pollcomp-async

      # Linux ASan has leak detection (macOS does not) — run BOTH completion smokes
      # (plaintext + TLS-via-mock), the pollcomp op-table, and the TLS/h2 buffers under
      # ASan+UBSan with leak checking.
      - name: Completion roundtrips under ASan+UBSan (leak detection)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: make smoke-pollcomp-asan

      # RC-2: runtime injection — a DEFAULT (readiness-compiled) libkeel serves a request
      # over a pollcomp completion backend injected via KlEventCtx.event_provider (the
      # completion axis is now runtime-injectable, not only link-time BACKEND=).
      - name: Runtime-injected completion backend (default libkeel + pollcomp)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: make smoke-completion-inject-asan

  completion-iouring:
    # io_uring is completion-native: BACKEND=iouring builds event_iouring.c (SQE/CQE
    # completion + completion_driver.c); the readiness POLL_ADD adapter was retired (8f-5d)
    # and the iouringcomp alias dropped. This job runs the end-to-end smokes; the unit-suite
    # job below runs the curated regression suite. Linux-only.
    name: Completion (io_uring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Build io_uring backend (BACKEND=iouring → completion)
        run: make BACKEND=iouring

      # Full completion driver over io_uring: GET + POST + sendfile + stream + UDP + h2c +
      # h2 prior-knowledge + idle-timeout + keep-alive + resilience + large partial-send.
      - name: End-to-end HTTP-over-io_uring roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=iouring smoke-iouring

      # Async/thread-pool over the completion loop — the watcher relay via single-shot
      # IORING_OP_POLL_ADD (the io_uring way to meet the same KL_COMP_WATCHER contract).
      - name: Async/thread-pool-over-io_uring roundtrip smoke test
        timeout-minutes: 5
        run: make BACKEND=iouring smoke-iouring-async

      # LeakSanitizer over the io_uring op/registered-buffer/splice/watcher lifecycle — the
      # coverage the plain smokes lack (a watch leak once reached main without it).
      - name: io_uring smokes under ASan+UBSan (leak detection)
        timeout-minutes: 8
        run: make smoke-iouring-asan

  completion-iouring-suite:
    # Phase 8f-3: the unit-test suites that run over the io_uring completion backend — a
    # regression gate alongside the smokes (backend-agnostic logic + protocol/loop suites
    # driven through kl_server_run / kl_event_ctx_run). Readiness-model-coupled suites are
    # excluded (see the IOURING_TEST_SUITES comment in the Makefile — those need a
    # per-test overlapped-provider opt-in, not a backend fix).
    name: Completion (io_uring) unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
      - name: Build completion backend (io_uring)
        run: make BACKEND=iouring
      - name: Unit-test suites over io_uring completion
        timeout-minutes: 10
        run: make BACKEND=iouring test-iouring

  windows:
    name: Windows (MinGW, full core)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # NOTE: SHA-pin this to match the repo's action-pinning policy.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          install: mingw-w64-x86_64-gcc make

      # WSAPoll event backend + Winsock provider. Builds and links the entire
      # library on Windows — TCP HTTP server + sync/async client, the UDP
      # datagram core (WSARecvMsg/WSASendMsg + cmsg), AND the built-in DNS
      # resolver (iphlpapi config discovery) — then runs real loopback smoke
      # tests for each.
      - name: Build full core (Winsock)
        run: make OS=windows CC=gcc

      - name: Link + plaintext TCP roundtrip smoke test
        timeout-minutes: 3
        run: make OS=windows CC=gcc smoke-tcp

      - name: Link + UDP datagram roundtrip smoke test
        timeout-minutes: 3
        run: make OS=windows CC=gcc smoke-udp

      - name: Link + DNS resolver init/resolve smoke test
        timeout-minutes: 3
        run: make OS=windows CC=gcc smoke-dns

      # Platform-neutral unit-test subset (utest suites that build AND run on
      # Winsock today). Staged toward parity — see docs/phase6_winsock_design.md
      # Part C; expand WIN_TEST_SUITES in the Makefile as more suites are ported.
      - name: Run Windows unit-test subset
        timeout-minutes: 5
        run: make OS=windows CC=gcc test-win

  windows-iocp:
    name: Windows (IOCP)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # NOTE: SHA-pin this to match the repo's action-pinning policy.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          install: mingw-w64-x86_64-gcc make

      # IOCP completion backend (BACKEND=iocp). Increment 2: this gates that the
      # completion backend TU (event_iocp.c) + overlapped provider compile and the
      # whole library links with them, and boots a real IOCP loop. The completion
      # connection driver (server-over-IOCP) lands in the next increment, at which
      # point the full suite + a smoke test join here. See docs/phase8_iocp_design.md.
      - name: Build full core (IOCP link gate)
        run: make OS=windows BACKEND=iocp CC=gcc

      - name: Run IOCP backend lifecycle + negotiation suite
        timeout-minutes: 5
        run: make OS=windows BACKEND=iocp CC=gcc test-win-iocp

      - name: End-to-end HTTP-over-IOCP roundtrip smoke test
        timeout-minutes: 3
        run: make OS=windows BACKEND=iocp CC=gcc smoke-iocp

      # Runtime-test event_iocp.c's IOCP-specific TLS mechanics (KL_IOCP_TLS_RECV,
      # feed-in-drain, overlapped ciphertext WSASend) via the portable identity mock TLS
      # — no mbedTLS on the runner. This is the last compile-gated-only path on Windows.
      - name: End-to-end TLS-over-IOCP roundtrip smoke test (mock TLS)
        timeout-minutes: 3
        run: make OS=windows BACKEND=iocp CC=gcc smoke-iocp-tls

      # The IOCP watcher relay (overlapped WSARecv on the thread-pool wakeup socket surfaces
      # KL_COMP_WATCHER) — async/thread-pool handlers over the completion loop (8e-2c).
      - name: End-to-end async/thread-pool-over-IOCP roundtrip smoke test
        timeout-minutes: 3
        run: make OS=windows BACKEND=iocp CC=gcc smoke-iocp-async

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: make debug-test

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: make fuzz CC=clang

      - name: Fuzz HTTP parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_parser fuzz/corpus_parser/ -max_total_time=60

      - name: Fuzz multipart parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_multipart fuzz/corpus_multipart/ -max_total_time=60

      - name: Fuzz WebSocket parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_websocket fuzz/corpus_websocket/ -max_total_time=60

      - name: Fuzz response parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_response_parser fuzz/corpus_response_parser/ -max_total_time=60

      - name: Fuzz DNS response parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_dns fuzz/corpus_dns/ -max_total_time=60

      - name: Fuzz PROXY protocol parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_proxy fuzz/corpus_proxy/ -max_total_time=60

      - name: Fuzz URL parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_url fuzz/corpus_url/ -max_total_time=60

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

      - name: Address-neutrality gate (protocol TUs are KlSockAddr-only)
        run: make check-sockaddr-neutral

      - name: W^X surface guard (no JIT/dlopen/exec/mmap+PROT_EXEC)
        run: make wx-guard

      - name: Build hardening — binary flag assertion
        run: |
          # Build a test binary and assert the hardening flags actually
          # propagated to the linker output. RW (not RWE) on GNU_STACK
          # confirms -Wl,-z,noexecstack landed. BIND_NOW + GNU_RELRO
          # confirm RELRO is full, not partial.
          #
          # `readelf -lW` forces wide one-line-per-segment output so
          # the flag column (RW / RWE / R) is on the same line as the
          # segment name. Without -W, flags wrap to a second line and
          # grep cannot correlate them with GNU_STACK.
          make tests/test_router
          STACK_LINE=$(readelf -lW tests/test_router | awk '/GNU_STACK/ {print; exit}')
          echo "GNU_STACK: $STACK_LINE"
          if echo "$STACK_LINE" | grep -qE ' RWE '; then
            echo "FAIL: GNU_STACK is executable (RWE)"
            exit 1
          fi
          if ! echo "$STACK_LINE" | grep -qE ' RW '; then
            echo "FAIL: GNU_STACK missing RW flag"
            exit 1
          fi
          if ! readelf -d tests/test_router | grep -q 'BIND_NOW'; then
            echo "FAIL: BIND_NOW not present (no full RELRO)"
            exit 1
          fi
          if ! readelf -lW tests/test_router | grep -q 'GNU_RELRO'; then
            echo "FAIL: GNU_RELRO segment missing"
            exit 1
          fi
          echo "PASS: GNU_STACK=RW, BIND_NOW set, GNU_RELRO present"

  musl:
    name: Linux (musl/Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.19

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps
        run: apk add --no-cache build-base curl

      - name: Build
        run: make

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install cosmocc
        run: |
          mkdir -p /opt/cosmo
          wget -qO /tmp/cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip -q -d /opt/cosmo /tmp/cosmocc.zip
          rm /tmp/cosmocc.zip
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build
        run: make CC=cosmocc

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke CC=cosmocc

  # Optional first-party integrations + external conformance. Keeps the mbedTLS +
  # nghttp2 adapters (and the ALPN / h2spec / interop work) from silently rotting,
  # while the ordinary core build above stays dependency-light. mbedTLS is built
  # from source (Ubuntu ships 2.28, incompatible with the 3.x adapter); nghttp2 is
  # the system package via pkg-config.
  integrations:
    name: Integrations (mbedTLS + nghttp2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps (nghttp2, tools, mbedTLS build prereqs)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libnghttp2-dev \
            curl openssl python3-jinja2 python3-jsonschema \
            nghttp2-client nghttp2-server

      - name: Install h2spec
        run: |
          curl -sSL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin

      - name: Build mbedTLS 3.6.x from source
        timeout-minutes: 6
        run: |
          git clone --depth 1 -b v3.6.2 --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git "$HOME/mbedtls"
          make -C "$HOME/mbedtls" -j"$(nproc)" lib

      - name: Build core (dependency-light — no TLS/HTTP2 libs)
        run: make

      - name: nghttp2 adapter — roundtrip + real-socket e2e
        timeout-minutes: 5
        run: make -C integrations/nghttp2 test

      - name: nghttp2 conformance — h2spec
        timeout-minutes: 5
        # h2spec exits non-zero on ANY failure; Keel's expected result is ~136/146
        # (the residual ~10 are nghttp2 library behavior — nghttpd fails the same
        # cases; see integrations/nghttp2/README.md). Gate on a pass-count floor so
        # the result stays visible and a real regression fails the job, without
        # tripping on the known nghttp2-parity failures.
        run: |
          out="$(make -C integrations/nghttp2 h2spec 2>&1 || true)"
          echo "$out" | grep -aE "[0-9]+ tests," || true
          passed="$(echo "$out" | grep -aoE "[0-9]+ passed" | grep -oE "[0-9]+" | head -1)"
          echo "h2spec passed=${passed:-0} (floor 130)"
          test "${passed:-0}" -ge 130 || { echo "h2spec regression: ${passed:-0} < 130 passed"; exit 1; }

      - name: nghttp2 load — h2load
        timeout-minutes: 5
        run: make -C integrations/nghttp2 h2load

      - name: nghttp2 interop — curl + nghttpd
        timeout-minutes: 5
        run: |
          make -C integrations/nghttp2 interop-curl
          PATH="$PATH:/usr/sbin" make -C integrations/nghttp2 interop-nghttpd

      - name: ALPN e2e — mbedTLS + nghttp2 + openssl + curl + Keel client
        timeout-minutes: 5
        run: make -C integrations/nghttp2 alpn-interop MBEDTLS_DIR="$HOME/mbedtls"

      - name: mbedTLS adapter — real TLS handshake (folds mbedTLS into libkeel.a; runs last)
        timeout-minutes: 5
        run: make KEEL_TLS=mbedtls MBEDTLS_DIR="$HOME/mbedtls" smoke-tls

  lwip:
    name: Integration (lwIP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-jinja2 python3-jsonschema

      - name: Fetch lwIP + contrib (BYO — not vendored)
        timeout-minutes: 5
        run: |
          git clone --depth 1 -b STABLE-2_2_0_RELEASE \
            https://github.com/lwip-tcpip/lwip "$HOME/lwip"
          # lwip-contrib (unix port) is on Savannah; the GitHub mirror is gone.
          rm -rf "$HOME/lwip/contrib"
          git clone --depth 1 \
            https://git.savannah.nongnu.org/git/lwip/lwip-contrib.git "$HOME/lwip/contrib"

      - name: Build mbedTLS 3.6.x from source (for the HTTPS-over-lwIP phase)
        timeout-minutes: 6
        run: |
          git clone --depth 1 -b v3.6.2 --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git "$HOME/mbedtls"
          make -C "$HOME/mbedtls" -j"$(nproc)" lib

      - name: Build core (stock libkeel — no KEEL_PLATFORM_LWIP)
        run: make

      - name: lwIP loopback — stock libkeel + lwIP providers (server + client + UDP echo)
        timeout-minutes: 5
        run: make -C integrations/lwip loopback LWIP_DIR="$HOME/lwip"

      - name: lwIP HTTPS loopback — mbedTLS BIO routed through the lwIP socket provider
        timeout-minutes: 5
        run: make -C integrations/lwip loopback-tls LWIP_DIR="$HOME/lwip" MBEDTLS_DIR="$HOME/mbedtls"

      - name: lwIP raw-API spike — NO_SYS=1 tcp_* callbacks over loopback (Phase 9 foundation)
        timeout-minutes: 5
        run: make -C integrations/lwip raw-spike LWIP_DIR="$HOME/lwip"

      - name: lwIP raw completion backend — P9-1 tick test (BACKEND=lwipraw + completion_driver)
        timeout-minutes: 5
        run: make -C integrations/lwip loopback-raw LWIP_DIR="$HOME/lwip"
