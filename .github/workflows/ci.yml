name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (epoll)
            os: ubuntu-latest
            backend: ""
            deps: ""
          - name: Linux (io_uring)
            os: ubuntu-latest
            backend: "BACKEND=iouring"
            deps: "liburing-dev"
          - name: Linux (poll fallback)
            os: ubuntu-latest
            backend: "BACKEND=poll"
            deps: ""
          - name: macOS (kqueue)
            os: macos-latest
            backend: ""
            deps: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk ${{ matrix.deps }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install wrk

      - name: Build
        run: make ${{ matrix.backend }}

      - name: Test
        timeout-minutes: 5
        run: make test ${{ matrix.backend }}

      - name: Build examples
        run: make examples ${{ matrix.backend }}

      - name: Smoke test
        run: |
          ./examples/hello 9095 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null" EXIT

          for i in 1 2 3 4 5; do
            if curl -s http://localhost:9095/hello >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          RESPONSE=$(curl -s http://localhost:9095/hello)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"hello"'

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: make debug-test

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: make fuzz CC=clang

      - name: Fuzz HTTP parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_parser fuzz/corpus_parser/ -max_total_time=60

      - name: Fuzz multipart parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_multipart fuzz/corpus_multipart/ -max_total_time=60

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  musl:
    name: Linux (musl/Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.19

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: apk add --no-cache build-base

      - name: Build
        run: make

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Build examples
        run: make examples

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cosmocc
        run: |
          mkdir -p /opt/cosmo
          wget -qO- https://cosmo.zip/pub/cosmocc/cosmocc.zip | \
            busybox unzip -d /opt/cosmo -
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build
        run: make CC=cosmocc

      - name: Build examples
        run: make examples CC=cosmocc

      - name: Smoke test
        run: |
          ./examples/hello 9095 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null" EXIT

          for i in 1 2 3 4 5; do
            if curl -s http://localhost:9095/hello >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          RESPONSE=$(curl -s http://localhost:9095/hello)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"hello"'
