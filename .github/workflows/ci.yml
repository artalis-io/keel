name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (epoll)
            os: ubuntu-latest
            backend: ""
            deps: ""
          - name: Linux (io_uring)
            os: ubuntu-latest
            backend: "BACKEND=iouring"
            deps: "liburing-dev"
          - name: Linux (poll fallback)
            os: ubuntu-latest
            backend: "BACKEND=poll"
            deps: ""
          - name: macOS (kqueue)
            os: macos-latest
            backend: ""
            deps: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk ${{ matrix.deps }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install wrk

      - name: Build
        run: make ${{ matrix.backend }}

      - name: Test
        timeout-minutes: 5
        run: make test ${{ matrix.backend }}

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke ${{ matrix.backend }}

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: make debug-test

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: make fuzz CC=clang

      - name: Fuzz HTTP parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_parser fuzz/corpus_parser/ -max_total_time=60

      - name: Fuzz multipart parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_multipart fuzz/corpus_multipart/ -max_total_time=60

      - name: Fuzz WebSocket parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_websocket fuzz/corpus_websocket/ -max_total_time=60

      - name: Fuzz response parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_response_parser fuzz/corpus_response_parser/ -max_total_time=60

      - name: Fuzz DNS response parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_dns fuzz/corpus_dns/ -max_total_time=60

      - name: Fuzz PROXY protocol parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_proxy fuzz/corpus_proxy/ -max_total_time=60

      - name: Fuzz URL parser (60s)
        timeout-minutes: 3
        run: ./fuzz/fuzz_url fuzz/corpus_url/ -max_total_time=60

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

      - name: W^X surface guard (no JIT/dlopen/exec/mmap+PROT_EXEC)
        run: make wx-guard

      - name: Build hardening — binary flag assertion
        run: |
          # Build a test binary and assert the hardening flags actually
          # propagated to the linker output. RW (not RWE) on GNU_STACK
          # confirms -Wl,-z,noexecstack landed. BIND_NOW + GNU_RELRO
          # confirm RELRO is full, not partial.
          #
          # `readelf -lW` forces wide one-line-per-segment output so
          # the flag column (RW / RWE / R) is on the same line as the
          # segment name. Without -W, flags wrap to a second line and
          # grep cannot correlate them with GNU_STACK.
          make tests/test_router
          STACK_LINE=$(readelf -lW tests/test_router | awk '/GNU_STACK/ {print; exit}')
          echo "GNU_STACK: $STACK_LINE"
          if echo "$STACK_LINE" | grep -qE ' RWE '; then
            echo "FAIL: GNU_STACK is executable (RWE)"
            exit 1
          fi
          if ! echo "$STACK_LINE" | grep -qE ' RW '; then
            echo "FAIL: GNU_STACK missing RW flag"
            exit 1
          fi
          if ! readelf -d tests/test_router | grep -q 'BIND_NOW'; then
            echo "FAIL: BIND_NOW not present (no full RELRO)"
            exit 1
          fi
          if ! readelf -lW tests/test_router | grep -q 'GNU_RELRO'; then
            echo "FAIL: GNU_RELRO segment missing"
            exit 1
          fi
          echo "PASS: GNU_STACK=RW, BIND_NOW set, GNU_RELRO present"

  musl:
    name: Linux (musl/Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.19

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install deps
        run: apk add --no-cache build-base curl

      - name: Build
        run: make

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install cosmocc
        run: |
          mkdir -p /opt/cosmo
          wget -qO /tmp/cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip -q -d /opt/cosmo /tmp/cosmocc.zip
          rm /tmp/cosmocc.zip
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build
        run: make CC=cosmocc

      - name: Smoke test examples
        timeout-minutes: 5
        run: make smoke CC=cosmocc
