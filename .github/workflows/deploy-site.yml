name: Deploy Keel Site

on:
  push:
    branches: [ "main" ]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site
        run: |
          cd site && make build
          echo "Build contents:"
          find build -type f

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync site/build/ s3://www.libkeel.dev \
            --delete

      - name: Configure CloudFront default root object
        if: ${{ env.CF_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront get-distribution-config \
            --id "$CF_DISTRIBUTION_ID" > /tmp/cf-config.json
          ETAG="$(jq -r '.ETag' /tmp/cf-config.json)"
          jq '.DistributionConfig.DefaultRootObject = "index.html" | .DistributionConfig' \
            /tmp/cf-config.json > /tmp/cf-distribution-config.json
          aws cloudfront update-distribution \
            --id "$CF_DISTRIBUTION_ID" \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/cf-distribution-config.json

      - name: Invalidate CloudFront cache
        if: ${{ env.CF_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*"
