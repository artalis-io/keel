# TEMPORARY probe-only workflow for the Windows AF_UNIX-cleanup spike (issue #250).
#
# It exists solely to execute .github/windows-probe/win_unix_node_probe.c natively on a
# windows-latest runner and record whether Windows can identity-anchor an AF_UNIX node delete
# (no-follow handle + stable file id + delete-by-handle). It changes no production code, is not a
# permanent test, and is REMOVED before the security PR is made mergeable. The probe always exits 0:
# unsupported behavior is a recorded result, not a job failure. Only the runner's own filesystem
# (expected NTFS) is probed; no ReFS/SMB/FAT conclusions are drawn.
name: Windows AF_UNIX cleanup probe (temporary)

on:
  push:
    branches: [security/unix-socket-cleanup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Windows node-cleanup probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build probe (MSVC, Windows SDK)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W3 /Fe:probe.exe .github\windows-probe\win_unix_node_probe.c

      - name: Run probe (records results; always exits 0)
        shell: cmd
        run: |
          probe.exe > probe-results.txt 2>&1
          echo === probe exit code: %ERRORLEVEL% ===
          type probe-results.txt

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe-results
          path: probe-results.txt
          if-no-files-found: warn
